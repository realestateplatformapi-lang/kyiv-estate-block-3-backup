<body><main class="wrap">
<header class="top"><h1 class="brand">KYIV ESTATE</h1></header>
<section class="panel">
  <label for="listing">Paste a link</label>
  <input id="listing" autocomplete="url" placeholder="https://…">
  <div class="progress" aria-hidden="true"><span id="progress"></span></div><p class="status" id="status"></p>
  <div class="create-row"><button class="primary" id="extract" type="button">Create</button><button class="action" id="retry" type="button" hidden>Retry</button></div><div class="language-switch" aria-label="Language"><button id="topUk" class="active" type="button">Ukrainian</button><button id="topEn" type="button">English</button></div>

  <div class="action-list"><div class="action-row"><button class="action" id="publishUk" type="button">Publish Telegraph · Ukrainian</button><span class="action-result" id="publishUkResult"></span></div><div class="action-row"><button class="action" id="publishEn" type="button">Publish Telegraph · English</button><span class="action-result" id="publishEnResult"></span></div><div class="action-row"><button class="action" id="downloadPdfUk" type="button">Download PDF · Ukrainian</button><span class="action-result" id="downloadPdfUkResult"></span></div><div class="action-row"><button class="action" id="downloadPdfEn" type="button">Download PDF · English</button><span class="action-result" id="downloadPdfEnResult"></span></div><div class="action-row"><button class="action" id="downloadPhotos" type="button">Download all photos</button><span class="action-result" id="downloadPhotosResult"></span></div><div class="action-row"><button class="action" id="createAnother" type="button">Create another</button></div></div><button id="publish" type="button" class="hidden" tabindex="-1"></button><button id="downloadPdf" type="button" class="hidden" tabindex="-1"></button>
  <label><input id="includeTitle" type="checkbox"> Show title</label><div id="titleWrap" class="hidden"><label for="title">Title</label><input id="title"></div>
  <section class="facts"><h2>💰 Price</h2><div class="grid"><div><label for="uah">UAH</label><input id="uah" inputmode="decimal"></div><div><label for="usd">USD</label><input id="usd" inputmode="decimal"></div><div><label for="eur">EUR</label><input id="eur" inputmode="decimal"></div></div><p class="hint" id="rateInfo"></p><h2>🏠 Property details</h2><div class="grid two"><div><label for="area">Total area (m²)</label><input id="area" inputmode="decimal"></div><div id="floorRow"><label id="floorLabel" for="floor">Floor / total floors</label><input id="floor"></div><div id="totalFloorsRow"><label id="totalFloorsLabel" for="totalFloors">Total floors</label><input id="totalFloors" inputmode="numeric"></div><div id="roomsRow"><label for="rooms">Rooms</label><input id="rooms" inputmode="numeric"></div><div id="landAreaRow"><label for="landArea">Land area</label><input id="landArea"></div></div><label for="address">Address</label><input id="address" placeholder="Kyiv, street and building number"></section>
  <h2 class="section-title">📝 Description</h2><label>Text for Telegraph and PDF</label><div class="mode-switch"><button id="originalMode" class="active" type="button">Original text</button><button id="aiTextMode" type="button">AI text</button></div><select id="textMode" class="hidden"><option value="original" selected>Original text</option><option value="ai">AI text</option></select><div class="compare"><section class="text-card main" id="originalCard"><label for="originalText">Original text · Main</label><textarea id="originalText"></textarea></section><section class="text-card" id="aiCard"><label for="text">AI text · Publication-ready</label><textarea id="text"></textarea></section></div>
  <section id="photosSection"><h2 class="section-title">📷 Photos</h2><p class="hint" id="photoHint">Only selected property photos are used.</p><div class="photos" id="photos"></div><div class="compare hidden" id="mediaCompare"><section class="media-pane main" id="processedPane"><h3>AI processed · Main</h3><div class="photos" id="processedPhotos"></div></section><section class="media-pane" id="originalPane"><h3>Original</h3><div class="photos" id="originalPhotos"></div></section></div></section>
  <p class="status" id="publishStatus"></p>
</section>
</main><script>
let listing={},lang='uk',processingMode='browser',translations={uk:{title:'',text:''},en:{title:'',text:''}},originalTranslations={uk:'',en:''},packageUrls=null,mediaPairs=[],movingMedia=null,browserItems=[],browserMoving=null;
function fmtPrice(value){const raw=String(value||'').replace(/\s/g,'');return /^\d+$/.test(raw)?raw.replace(/\B(?=(\d{3})+(?!\d))/g,' '):value}
const $=id=>document.getElementById(id);const words={uk:{reading:'Loading listing…',translating:'Creating English version…',processing:'Processing and sorting photos on the Windows workstation…',publishing:'Publishing Ukrainian and English pages…',pdf:'Creating PDF…',ready:'Ready. Property photos: ',published:'Published: '},en:{reading:'Loading listing…',translating:'Creating English version…',processing:'Processing and sorting photos on the Windows workstation…',publishing:'Publishing Ukrainian and English pages…',pdf:'Creating PDF…',ready:'Ready. Property photos: ',published:'Published: '}};
function message(id,text,error=false){$(id).textContent=text;$(id).className='status'+(error?' error':'')}
async function postJson(path,body){let lastError;for(let attempt=0;attempt<3;attempt++){try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),raw=await response.text(),data=raw?JSON.parse(raw):{};if(response.ok)return data;lastError=Error(data.error||`The service returned ${response.status}.`)}catch(error){lastError=error}if(attempt<2)await new Promise(resolve=>setTimeout(resolve,1200*(attempt+1)))}throw lastError||Error('The service did not return a response. Please try again.')}
async function postPdf(body){let lastError;for(let attempt=0;attempt<3;attempt++){try{const response=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.ok)return await response.blob();const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}lastError=Error(data.error||`PDF service returned ${response.status}.`)}catch(error){lastError=error}if(attempt<2)await new Promise(resolve=>setTimeout(resolve,1500*(attempt+1)))}throw lastError||Error('PDF could not be created. Please try again.')}
function setProgress(value){$('progress').style.width=`${value}%`}
function setMode(mode){processingMode=mode}
function refineText(value){const seen=new Set();return String(value||'').split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>{const key=x.toLowerCase().replace(/\s+/g,' ');if(!key||seen.has(key))return false;seen.add(key);return true}).join(' ')}
function storeCurrent(){if(!$('editor').hidden){translations[lang]={title:$('title').value,text:$('text').value};originalTranslations[lang]=$('originalText').value}}
function renderLanguage(){document.documentElement.lang=lang;$('topUk').classList.toggle('active',lang==='uk');$('topEn').classList.toggle('active',lang==='en')}
function renderPropertyDetails(){const type=listing.details?.property_type||'apartment',house=type==='house',commercial=type==='commercial';$('floorRow').classList.toggle('hidden',house);$('totalFloorsRow').classList.toggle('hidden',!house);$('roomsRow').classList.toggle('hidden',commercial);$('landAreaRow').classList.toggle('hidden',!house);$('floorLabel').textContent=commercial?'Floor':'Floor / total floors';$('totalFloorsLabel').textContent='Total floors'}
async function ensureEnglish(){storeCurrent();message('publishStatus',words[lang].translating);if(!translations.en.text)translations.en=await postJson('/api/translate',translations.uk);if(!originalTranslations.en){const translated=await postJson('/api/translate',{title:'',text:originalTranslations.uk});originalTranslations.en=translated.text}const address=lang==='uk'?$('address').value.trim():(listing.details?.address_uk||listing.details?.address||'');if(lang==='uk')listing.details.address_uk=address;if(address&&listing.details?.addressSource!==address){const translated=await postJson('/api/translate',{title:'',text:address});listing.details.address_en=translated.text;listing.details.addressSource=address}}
async function switchLanguage(next){storeCurrent();if(next==='en'&&listing.internal_id)await ensureEnglish();lang=next;renderLanguage();if(listing.internal_id){$('title').value=translations[lang].title;$('text').value=translations[lang].text;$('originalText').value=originalTranslations[lang];const ukAddress=listing.details.address_uk||listing.details.address||'';$('address').value=lang==='en'?(listing.details.address_en||ukAddress):ukAddress;message('publishStatus','')}}
function selectedIndexes(){if(processingMode==='ai'&&mediaPairs.length)return mediaPairs.filter(x=>x.included).map(x=>x.order-1);return browserItems.filter(x=>x.included).map(x=>x.originalIndex)}
function selectedImages(){return processingMode==='ai'?listing.images:browserItems.filter(x=>x.included).map(x=>x.src)}
function mediaChoices(){if(processingMode!=='ai')return[];if(!mediaPairs.length)return null;return mediaPairs.filter(x=>x.included).map(x=>({order:x.order,kind:x.kind}))}
 function payload(){storeCurrent();const mode=$('textMode').value,selected=mode==='original'?originalTranslations[lang]:translations[lang].text,chosen={uk:{...translations.uk,text:mode==='original'?originalTranslations.uk:translations.uk.text},en:{...translations.en,text:mode==='original'?originalTranslations.en:translations.en.text}},type=listing.details?.property_type||'apartment',combined=$('floor').value.trim(),parts=combined.split('/').map(value=>value.trim()),floor=type==='apartment'?parts[0]:combined,totalFloors=type==='apartment'?(parts[1]||''):$('totalFloors').value,ukAddress=listing.details?.address_uk||listing.details?.address||$('address').value,enAddress=listing.details?.address_en||(lang==='en'?$('address').value:'');chosen[lang]={title:$('title').value,text:selected};return{internal_id:listing.internal_id,external_id:listing.external_id,source:listing.source,processing_mode:'browser',include_title:$('includeTitle').checked,text_mode:mode,media_choices:[],translations:chosen,details:{...listing.details,area:$('area').value,floor,total_floors:totalFloors,rooms:$('rooms').value,land_area:$('landArea').value,address:ukAddress,address_en:enAddress},prices:{UAH:fmtPrice($('uah').value),USD:fmtPrice($('usd').value),EUR:fmtPrice($('eur').value),rate_date:listing.prices?.rate_date||'',rate_source:listing.prices?.rate_source||''},images:selectedImages(),language:lang,title:$('title').value,text:selected}}
function previewImageUrl(src){return String(src||'').replace(/;s=\d+x\d+/i,';s=480x480')}
function photoCard(src,index,checked=true,note='original'){const label=document.createElement('label');label.className='photo';const img=document.createElement('img');img.src=previewImageUrl(src);img.loading='lazy';img.decoding='async';img.draggable=false;img.alt=`KYIV ESTATE property photo ${index+1}`;const input=document.createElement('input');input.type='checkbox';input.checked=checked;input.dataset.index=index;input.setAttribute('aria-label',`Include photo ${index+1}`);const small=document.createElement('small');small.textContent=`${String(index+1).padStart(2,'0')} · ${note}`;label.append(img,input,small);return label}
function renderBrowserPhotos(){const root=$('photos');root.replaceChildren();browserItems.forEach((item,index)=>{const card=photoCard(item.src,index,item.included,'original');card.dataset.originalIndex=item.originalIndex;card.querySelector('input').onchange=e=>item.included=e.target.checked;card.onmousedown=e=>{if(e.target.tagName==='INPUT')return;browserMoving={item,card};card.classList.add('dragging');e.preventDefault()};root.append(card)})}
function showBrowserPhotos(images){browserItems=images.map((src,originalIndex)=>({src,originalIndex,included:true}));$('photos').classList.remove('hidden');$('mediaCompare').classList.add('hidden');renderBrowserPhotos()}
function pointerSwap(card,pair){card.onmousedown=e=>{if(e.target.tagName==='INPUT')return;movingMedia={pair,kind:card.dataset.kind,card};card.classList.add('dragging');e.preventDefault()}}
document.addEventListener('mouseup',e=>{const hit=document.elementFromPoint(e.clientX,e.clientY);if(browserMoving){browserMoving.card.classList.remove('dragging');const target=hit?.closest('#photos .photo');if(target){const from=browserItems.indexOf(browserMoving.item),to=browserItems.findIndex(x=>x.originalIndex===Number(target.dataset.originalIndex));if(from>=0&&to>=0&&from!==to){browserItems.splice(from,1);browserItems.splice(to,0,browserMoving.item)}}browserMoving=null;renderBrowserPhotos();return}if(!movingMedia)return;const pane=hit?.closest('.media-pane'),target=hit?.closest('.photo');movingMedia.card.classList.remove('dragging');if(pane){movingMedia.pair.kind=movingMedia.kind;movingMedia.pair.included=pane.id==='processedPane';if(pane.id==='processedPane'&&target){const targetPair=mediaPairs.find(x=>x.order===Number(target.dataset.order)),from=mediaPairs.indexOf(movingMedia.pair),to=mediaPairs.indexOf(targetPair);if(from>=0&&to>=0&&from!==to){mediaPairs.splice(from,1);mediaPairs.splice(to,0,movingMedia.pair)}}renderMediaCompare()}movingMedia=null});
function renderMediaCompare(){const main=$('processedPhotos'),original=$('originalPhotos');main.replaceChildren();original.replaceChildren();mediaPairs.forEach((pair,index)=>{const mainKind=pair.kind,altKind=mainKind==='processed'?'original':'processed';const mainCard=photoCard(pair[mainKind],index,pair.included,mainKind);mainCard.dataset.order=pair.order;mainCard.dataset.kind=mainKind;mainCard.querySelector('input').onchange=e=>pair.included=e.target.checked;const altCard=photoCard(pair[altKind],index,false,altKind);altCard.querySelector('input').remove();altCard.dataset.order=pair.order;altCard.dataset.kind=altKind;for(const card of [mainCard,altCard])pointerSwap(card,pair);main.append(mainCard);original.append(altCard)})}
function enableDrop(pane){pane.ondragover=e=>{e.preventDefault();pane.classList.add('dragover')};pane.ondragleave=()=>pane.classList.remove('dragover');pane.ondrop=e=>{e.preventDefault();pane.classList.remove('dragover');const data=JSON.parse(e.dataTransfer.getData('text/plain'));const pair=mediaPairs.find(x=>x.order===data.order);if(pair){pair.kind=data.kind;if(pane.id==='originalPane')pair.included=false;else pair.included=true;renderMediaCompare()}}}
async function createPackage(){await ensureEnglish();message('publishStatus',words[lang].processing);setProgress(60);const r=await fetch('/api/package',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}),d=await r.json();if(!r.ok)throw Error(d.error);packageUrls=d;setProgress(100);return d}
async function extract(){const button=$('extract');button.disabled=true;$('retry').hidden=true;setProgress(10);message('status',words[lang].reading);try{const d=await postJson('/api/extract',{url:$('listing').value});listing=d;listing.details.address_uk=d.details.address||'';translations={uk:{title:d.title,text:refineText(d.ai_description||d.description)},en:{title:'',text:''}};originalTranslations={uk:d.original_description||d.description,en:''};lang='uk';renderLanguage();$('title').value=d.title;$('text').value=translations.uk.text;$('originalText').value=originalTranslations.uk;$('uah').value=fmtPrice(d.prices?.UAH||'');$('usd').value=fmtPrice(d.prices?.USD||'');$('eur').value=fmtPrice(d.prices?.EUR||'');$('area').value=d.details.area||'';$('floor').value=d.details.property_type==='apartment'?[d.details.floor,d.details.total_floors].filter(Boolean).join('/'):d.details.floor||'';$('totalFloors').value=d.details.total_floors||'';$('rooms').value=d.details.rooms||'';$('landArea').value=d.details.land_area||'';$('address').value=listing.details.address_uk;renderPropertyDetails();$('rateInfo').textContent=d.prices?.rate_date?`NBU · ${d.prices.rate_date}`:'';$('editor').hidden=false;if(processingMode==='ai'){showBrowserPhotos(d.images);const pack=await createPackage();mediaPairs=pack.processed.map((src,index)=>({order:index+1,processed:src,original:pack.originals[index]||d.images[index],kind:'processed',included:true}));$('photos').classList.add('hidden');$('mediaCompare').classList.remove('hidden');renderMediaCompare()}else{mediaPairs=[];showBrowserPhotos(d.images);setProgress(100)}message('status',words[lang].ready+d.images.length);message('publishStatus','')}catch(error){setProgress(0);message('status',error?.message||'The service did not return a response. Please try again.',true);$('retry').hidden=false}finally{button.disabled=false}}
$('extract').onclick=extract;$('retry').onclick=extract;$('topUk').onclick=()=>switchLanguage('uk').catch(e=>message('publishStatus',e.message,true));$('topEn').onclick=()=>switchLanguage('en').catch(e=>message('publishStatus',e.message,true));enableDrop($('processedPane'));enableDrop($('originalPane'));
$('publish').onclick=async()=>{const button=$('publish');button.disabled=true;try{await ensureEnglish();message('publishStatus',words[lang].publishing);const r=await fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())}),d=await r.json();if(!r.ok)throw Error(d.error);$('publishStatus').innerHTML=`<span class="result">${words[lang].published}<a target="_blank" rel="noopener" href="${d.urls.uk}">UA</a> · <a target="_blank" rel="noopener" href="${d.urls.en}">EN</a></span>`}catch(e){message('publishStatus',e.message,true)}finally{button.disabled=false}};
$('downloadPdf').onclick=async()=>{const button=$('downloadPdf');button.disabled=true;message('publishStatus',words[lang].pdf);try{await ensureEnglish();if(processingMode==='ai')await createPackage();const base=payload();for(const language of ['uk','en']){message('publishStatus',`Creating ${language.toUpperCase()} PDF…`);const version={...base,language,title:base.translations[language].title,text:base.translations[language].text},blob=await postPdf(version),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`${listing.internal_id||'listing'}-${language}.pdf`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}message('publishStatus','UA and EN PDFs downloaded.')}catch(e){message('publishStatus',e.message,true)}finally{button.disabled=false}};
function chooseText(mode){$('textMode').value=mode;$('originalMode').classList.toggle('active',mode==='original');$('aiTextMode').classList.toggle('active',mode==='ai');$('originalCard').classList.toggle('main',mode==='original');$('aiCard').classList.toggle('main',mode==='ai')}$('originalMode').onclick=()=>chooseText('original');$('aiTextMode').onclick=()=>chooseText('ai');$('includeTitle').onchange=()=>{$('titleWrap').classList.toggle('hidden',!$('includeTitle').checked)};new MutationObserver(()=>{if(listing.details?.address)$('address').value=listing.details.address}).observe($('editor'),{attributes:true});$('createAnother').onclick=()=>{listing={};translations={uk:{title:'',text:''},en:{title:'',text:''}};originalTranslations={uk:'',en:''};packageUrls=null;mediaPairs=[];browserItems=[];$('listing').value='';$('editor').hidden=true;setProgress(0);message('status','');$('listing').focus()};renderLanguage();
</script><script>
async function languagePayload(language){
  storeCurrent();
  await ensureEnglish();
  const base=payload();
  const mode=$('textMode').value;
  const version=base.translations[language];
  base.language=language;
  base.title=version.title;
  base.text=mode==='original'?originalTranslations[language]:version.text;
  return base;
}
async function publishLanguage(language){
  const button=$(language==='uk'?'publishUk':'publishEn');
  button.disabled=true;
  try{
    const data=await languagePayload(language);
    message('publishStatus',`Publishing ${language==='uk'?'Ukrainian':'English'} Telegraph…`);
    const result=await postJson('/api/publish',data);
    const label=language==='uk'?'Ukrainian Telegraph':'English Telegraph';
    message('publishStatus','');$(`${button.id}Result`).innerHTML=`<span class="result">${label}: <a target="_blank" rel="noopener" href="${result.url}">Open</a></span>`;
  }catch(error){$(`${button.id}Result`).textContent=error.message;$(`${button.id}Result`).className='action-result error'}finally{button.disabled=false}
}
async function downloadLanguagePdf(language){
  const button=$(language==='uk'?'downloadPdfUk':'downloadPdfEn');
  button.disabled=true;
  try{
    if(processingMode==='ai') await createPackage();
    const data=await languagePayload(language);
    message('publishStatus',`Creating ${language==='uk'?'Ukrainian':'English'} PDF…`);
    const blob=await postPdf(data),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=`${listing.internal_id||'listing'}-${language}.pdf`;
    document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
    message('publishStatus','');$(`${button.id}Result`).innerHTML=`<span class="result">${language==='uk'?'Ukrainian':'English'} PDF downloaded.</span>`;
  }catch(error){$(`${button.id}Result`).textContent=error.message;$(`${button.id}Result`).className='action-result error'}finally{button.disabled=false}
}
async function downloadAllPhotos(){
  const button=$('downloadPhotos');button.disabled=true;
  try{
    const response=await fetch('/api/photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
    if(!response.ok){const raw=await response.text();let data={};try{data=JSON.parse(raw)}catch{}throw Error(data.error||`Photo service returned ${response.status}.`)}
    const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=`${listing.internal_id||'listing'}-photos.zip`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
    $('downloadPhotosResult').innerHTML='<span class="result">All selected source photos downloaded.</span>';
  }catch(error){$('downloadPhotosResult').textContent=error.message;$('downloadPhotosResult').className='action-result error'}finally{button.disabled=false}
}
$('publishUk').onclick=()=>publishLanguage('uk');
$('publishEn').onclick=()=>publishLanguage('en');
$('downloadPdfUk').onclick=()=>downloadLanguagePdf('uk');
$('downloadPdfEn').onclick=()=>downloadLanguagePdf('en');
$('downloadPhotos').onclick=downloadAllPhotos;
</script></body></html>
